name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q __init__.py nodes scripts tests
      - name: Release preflight
        run: python scripts/release_preflight.py
      - name: Node contract audit
        run: python scripts/node_contract_audit.py --expected 79
      - name: Unit tests
        run: python -m unittest discover -s tests -v
